# Maximum recommended baseline. Still avoids lockout defaults.
PROFILE_NAME="hardened"
PROFILE_DESCRIPTION="Full module set except MFA and Wazuh (those require explicit confirmation)."
PROFILE_MODULES="updates,users,passwords,sudo,ssh,firewall,services,filesystem,permissions,kernel,sysctl,auditd,logging,fail2ban,time_sync,network,integrity,compliance"
SSH_DISABLE_ROOT_LOGIN=true
SSH_DISABLE_PASSWORD_AUTH=false
SSH_HARDEN_ALGORITHMS=true
FIREWALL_DEFAULT_DENY=true
MFA_ENABLED=false
WAZUH_ENABLED=false
FAIL2BAN_ENABLED=true
AUDITD_ENABLED=true
KERNEL_BLACKLIST_UNCOMMON=true
USER_LOCK_EMPTY_PASSWORDS=true
USER_TIGHTEN_HOMES=true
SERVICES_AUTO_DISABLE_DANGEROUS=true
FS_HARDEN_SHM=true
FS_HARDEN_TMP_STICKY=true
