# Database server profile — tight inbound policy, no assumed DB ports.
PROFILE_NAME="database-server"
PROFILE_DESCRIPTION="Hardened host policy. Database ports are not opened automatically; add them in firewall.conf."
PROFILE_MODULES="updates,users,passwords,sudo,ssh,firewall,services,filesystem,permissions,sysctl,auditd,logging,fail2ban,time_sync,network,integrity"
SSH_DISABLE_PASSWORD_AUTH=false
FIREWALL_DEFAULT_DENY=true
FIREWALL_ALLOWED_PORTS=""
MFA_ENABLED=false
WAZUH_ENABLED=false
# Database hosts typically should not route traffic.
SYSCTL_DISABLE_IP_FORWARD=true
