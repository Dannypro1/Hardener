# General-purpose server profile.
PROFILE_NAME="server"
PROFILE_DESCRIPTION="Core server hardening: SSH, firewall, sudo, sysctl, auditd, fail2ban. MFA and Wazuh remain opt-in."
PROFILE_MODULES="updates,users,passwords,sudo,ssh,firewall,services,permissions,sysctl,auditd,logging,fail2ban,time_sync,network"
SSH_DISABLE_PASSWORD_AUTH=false
FIREWALL_DEFAULT_DENY=true
MFA_ENABLED=false
WAZUH_ENABLED=false
FAIL2BAN_ENABLED=true
KERNEL_BLACKLIST_UNCOMMON=true
USER_LOCK_EMPTY_PASSWORDS=true
SERVICES_AUTO_DISABLE_DANGEROUS=true
