# TRAC site profile — SSH allowlist, sourced UFW, SIEM, auditd, fail2ban.
PROFILE_NAME="trac"
PROFILE_DESCRIPTION="TRAC controls: AllowUsers sys-trac/danny/ange/spencer, UFW from org CIDRs, Wazuh 10.10.11.40, auditd, fail2ban, unattended-upgrades."
PROFILE_MODULES="updates,users,passwords,sudo,ssh,firewall,services,permissions,sysctl,auditd,logging,fail2ban,time_sync,network,wazuh,compliance"
SSH_DISABLE_ROOT_LOGIN=true
SSH_DISABLE_PASSWORD_AUTH=false
SSH_ALLOW_USERS="sys-trac,danny,ange,spencer"
SSH_ENSURE_USERS="sys-trac,danny,ange,spencer"
USER_ENSURE_SSH_USERS=true
USER_NOLOGIN_SYSTEM=true
USER_NOLOGIN_EXTRA=true
FIREWALL_DEFAULT_DENY=true
FIREWALL_ALLOW_OUTBOUND=true
FIREWALL_INBOUND_SOURCES="10.0.0.0/8,41.242.140.0/22,196.223.240.0/21"
FIREWALL_ROLE="generic"
FAIL2BAN_ENABLED=true
FAIL2BAN_MAXRETRY=4
FAIL2BAN_BANTIME="15m"
WAZUH_ENABLED=true
WAZUH_MANAGER="10.10.11.40"
WAZUH_COLLECT_AUDIT=true
UNATTENDED_UPGRADES=true
PW_MINLEN=8
MFA_ENABLED=false

# Named administrators: passwords are entered through passwd, never stored here.
SSH_ENSURE_FULL_NAMES="ange:Ange Gakwandi;spencer:Spencer Kamayo"
SSH_TEMP_PASSWORD_USERS="ange,spencer"
SSH_ENSURE_SUDO=true
# Empty selects sudo on Ubuntu/Debian, wheel on Red Hat-family systems.
SSH_ENSURE_SUDO_GROUP=""
