# Web server profile — does not assume a specific application stack.
PROFILE_NAME="web-server"
PROFILE_DESCRIPTION="Server baseline plus HTTP/HTTPS firewall allowances. Does not disable application services."
PROFILE_MODULES="updates,users,passwords,sudo,ssh,firewall,services,filesystem,permissions,sysctl,auditd,logging,fail2ban,time_sync,network"
SSH_DISABLE_PASSWORD_AUTH=false
FIREWALL_DEFAULT_DENY=true
FIREWALL_ALLOWED_PORTS="80,443"
FIREWALL_ALLOWED_SERVICES="http,https"
MFA_ENABLED=false
WAZUH_ENABLED=false
# Web workloads often need forwarding (containers, reverse proxies). Leave IP forwarding untouched.
SYSCTL_DISABLE_IP_FORWARD=false
