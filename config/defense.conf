# =============================================================================
# Defense option defaults (shown in the customize menu)
# These are starting values only. Interactive runs let you toggle each one.
# Nothing is applied until you confirm the plan.
# Override on the CLI:  --set KERNEL_BLACKLIST_USB=true
# =============================================================================

# Users
USER_LOCK_EMPTY_PASSWORDS=true
USER_TIGHTEN_HOMES=false
USER_SET_UMASK=true
USER_SET_TMOUT=false
USER_NOLOGIN_SYSTEM=false
USER_TMOUT=900
USER_UMASK="027"

# Passwords
PW_APPLY_AGING=true
PW_APPLY_QUALITY=true
PW_APPLY_FAILLOCK=true
PW_FAILLOCK_DENY=5
PW_FAILLOCK_UNLOCK=900
PW_FAILLOCK_INTERVAL=900

# Kernel
KERNEL_BLACKLIST_UNCOMMON=true
KERNEL_BLACKLIST_USB=false

# Filesystem
FS_HARDEN_SHM=true
FS_HARDEN_TMP_STICKY=true
FS_TMP_NOEXEC=false

# Network
NETWORK_APPLY_SYSCTL=true
NETWORK_DISABLE_IPV6=false

# Services — telnet/rsh/NIS/TFTP only. avahi/cups still ask.
SERVICES_AUTO_DISABLE_DANGEROUS=true
