# =============================================================================
# Active defense defaults
# These controls are applied (not just audited) when the matching module runs.
# =============================================================================

# Kernel: blacklist unused network protocols and uncommon filesystems.
KERNEL_BLACKLIST_UNCOMMON=true
# USB storage blacklist can block recovery media — off by default.
KERNEL_BLACKLIST_USB=false

# Filesystem: remount /dev/shm with nodev,nosuid,noexec and enforce sticky /tmp.
FS_HARDEN_SHM=true
FS_HARDEN_TMP_STICKY=true
# noexec on /tmp breaks some installers. Off unless the role can tolerate it.
FS_TMP_NOEXEC=false

# Users: idle timeout (seconds). 0 disables the profile.d snippet.
USER_TMOUT=900
USER_UMASK="027"
# Tighten home directories to 0750 during apply.
USER_TIGHTEN_HOMES=true
# Lock empty-password accounts during apply (interactive still confirms).
USER_LOCK_EMPTY_PASSWORDS=true

# Passwords: local faillock / pwquality. Skip if the host is IdP-only.
PW_FAILLOCK_DENY=5
PW_FAILLOCK_UNLOCK=900
PW_FAILLOCK_INTERVAL=900

# Services: disable known-insecure daemons without prompting.
# avahi/cups/bluetooth still require confirmation.
SERVICES_AUTO_DISABLE_DANGEROUS=true
