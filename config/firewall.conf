# =============================================================================
# Firewall defaults
# The tool detects UFW, firewalld, or nftables and never locks out the
# current SSH session.
# =============================================================================

FIREWALL_DEFAULT_DENY=true
FIREWALL_ALLOW_OUTBOUND=true

# Extra inbound ports (comma-separated numbers). SSH is always preserved.
FIREWALL_ALLOWED_PORTS=""

# Extra inbound services for firewalld (comma-separated, e.g. http,https).
FIREWALL_ALLOWED_SERVICES=""

# Prefer the detected backend. Override only when necessary: ufw|firewalld|nftables
FIREWALL_BACKEND=""

# Seconds to wait after applying rules when a confirmation path is used.
FIREWALL_APPLY_TIMEOUT=30
