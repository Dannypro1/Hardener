# =============================================================================
# Firewall policy
# SSH is always kept open. Empty source/destination lists mean "any address".
# Interactive apply lets you set these; --set and this file work non-interactively.
# =============================================================================

FIREWALL_DEFAULT_DENY=true

# Extra inbound ports besides SSH. Examples: 80,443,53/udp,8080/tcp
FIREWALL_ALLOWED_PORTS=""

# Inbound source IPs or CIDRs allowed to those ports. Empty = any source.
# Example: 203.0.113.10,10.0.0.0/8
FIREWALL_INBOUND_SOURCES=""

# Outbound: true = allow all unless ports/destinations are also set.
FIREWALL_ALLOW_OUTBOUND=true

# If either list is set, outbound is restricted to those ports and/or destinations.
FIREWALL_OUTBOUND_PORTS=""
FIREWALL_OUTBOUND_DESTS=""

# Extra inbound services for firewalld (comma-separated, e.g. http,https).
FIREWALL_ALLOWED_SERVICES=""

# Prefer the detected backend. Override only when necessary: ufw|firewalld|nftables
FIREWALL_BACKEND=""
