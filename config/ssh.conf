# =============================================================================
# SSH hardening defaults
# Applied via a drop-in file; /etc/ssh/sshd_config is never overwritten.
# =============================================================================

# Leave empty to keep the current listen port.
SSH_PORT=""

# Disable direct root login. Keep a working sudo/admin account first.
SSH_DISABLE_ROOT_LOGIN=true

# Do not disable password auth by default — that can lock out hosts without keys.
SSH_DISABLE_PASSWORD_AUTH=false
SSH_PERMIT_EMPTY_PASSWORDS=false
SSH_MAX_AUTH_TRIES=3
SSH_LOGIN_GRACE_TIME=60
SSH_CLIENT_ALIVE_INTERVAL=300
SSH_CLIENT_ALIVE_COUNT_MAX=2
SSH_X11_FORWARDING=false
SSH_ALLOW_TCP_FORWARDING=false
SSH_ALLOW_AGENT_FORWARDING=false
SSH_PERMIT_TUNNEL=false
SSH_MAX_SESSIONS=4
SSH_MAX_STARTUPS="10:30:60"
SSH_USE_PAM=true
SSH_PRINT_MOTD=false
SSH_PRINT_LASTLOG=true
SSH_BANNER=""

# Comma-separated. Empty means do not restrict (safer default).
SSH_ALLOW_USERS=""
SSH_ALLOW_GROUPS=""
SSH_DENY_USERS=""
SSH_DENY_GROUPS=""

# Modern algorithms when the installed OpenSSH supports them.
SSH_HARDEN_ALGORITHMS=true
SSH_KEX_ALGORITHMS="curve25519-sha256,curve25519-sha256@libssh.org,diffie-hellman-group16-sha512,diffie-hellman-group18-sha512"
SSH_CIPHERS="chacha20-poly1305@openssh.com,aes256-gcm@openssh.com,aes128-gcm@openssh.com,aes256-ctr,aes192-ctr,aes128-ctr"
SSH_MACS="hmac-sha2-256-etm@openssh.com,hmac-sha2-512-etm@openssh.com,hmac-sha2-256,hmac-sha2-512"

# Drop-in path used when sshd_config.d is supported.
SSH_DROPIN_FILE="99-server-hardening.conf"
