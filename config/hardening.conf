# =============================================================================
# Server Hardener — main configuration
# Override values here or via a profile. Do not force one policy on every host.
# =============================================================================

# Never reboot unless the administrator explicitly enables this.
AUTO_REBOOT=false

# Optional modules (overridden by dedicated config files / profiles).
FAIL2BAN_ENABLED=true
WAZUH_ENABLED=false
WAZUH_MANAGER=""
MFA_ENABLED=false
MFA_METHOD="totp"
FIREWALL_DEFAULT_DENY=true
SSH_DISABLE_ROOT_LOGIN=true
SSH_DISABLE_PASSWORD_AUTH=false
SSH_MAX_AUTH_TRIES=3
SSH_CLIENT_ALIVE_INTERVAL=300

# Require confirmation before applying changes (ignored with --non-interactive).
REQUIRE_CONFIRMATION=true

# Keep at least this many backup sessions.
BACKUP_RETENTION=10

# Essential systemd units that must never be auto-disabled.
ESSENTIAL_SERVICES="sshd ssh systemd-logind dbus cron crond systemd-journald rsyslog NetworkManager networking systemd-networkd systemd-resolved chronyd chrony timesyncd ntpd auditd"

# Packages considered safe to recommend for removal on a typical server.
# Never removed automatically — listed for administrator review only.
UNNECESSARY_PACKAGES="telnet rsh-client rsh-redone-client talk ntalk xinetd ypbind ypserv tftp tftpd"

# Compliance mapping shown in reports (informational).
COMPLIANCE_FRAMEWORKS="CIS,NIST-800-53,CIS-Controls"
