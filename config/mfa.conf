# =============================================================================
# PAM TOTP MFA — optional, SSH-only by default
# Secrets are never stored in this repository or written to logs.
# =============================================================================

MFA_ENABLED=false
MFA_METHOD="totp"

# Comma-separated. Empty means no automatic user/group restriction.
MFA_USERS=""
MFA_GROUPS=""

# Keep password + TOTP (recommended). "nullok" allows users without a token.
MFA_REQUIRE_TOKEN=true
MFA_NULLOK=true

# PAM drop-in snippet name (never overwrite /etc/pam.d/sshd wholesale).
MFA_PAM_MARKER="server-hardener-mfa"
