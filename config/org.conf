# =============================================================================
# Organization controls (TRAC)
# Loaded after the generic configs. Profiles may override these.
# Passwords are never written here and never sent to Slack or logs.
# =============================================================================

# SSH — PermitRootLogin no, password + pubkey, no keyboard-interactive
SSH_DISABLE_ROOT_LOGIN=true
SSH_DISABLE_PASSWORD_AUTH=false
SSH_PUBKEY_AUTHENTICATION=true
SSH_CHALLENGE_RESPONSE=false
SSH_MAX_AUTH_TRIES=3
SSH_ALLOW_USERS="sys-trac,danny"
SSH_ENSURE_USERS="sys-trac,danny"
SSH_ENSURE_SUDO=true

# Create the AllowUsers accounts if missing. Password is prompted, never logged.
USER_ENSURE_SSH_USERS=true
USER_NOLOGIN_SYSTEM=true
# Extra human accounts not in AllowUsers get nologin (never deleted).
USER_NOLOGIN_EXTRA=true

# Password quality (libpam-pwquality)
PW_MINLEN=8
PW_MINCLASS=1
PW_APPLY_QUALITY=true
PW_APPLY_FAILLOCK=true

# UFW: deny in, allow out. Admin/UI ports only from these networks.
FIREWALL_DEFAULT_DENY=true
FIREWALL_ALLOW_OUTBOUND=true
FIREWALL_INBOUND_SOURCES="10.0.0.0/8,41.242.140.0/22,196.223.240.0/21"
# Role: generic | unifi | rpki  (sets restricted vs discovery ports)
FIREWALL_ROLE="generic"

# Fail2ban sshd
FAIL2BAN_ENABLED=true
FAIL2BAN_MAXRETRY=4
FAIL2BAN_BANTIME="15m"
FAIL2BAN_FINDTIME="10m"

# Wazuh / SIEM
WAZUH_ENABLED=true
WAZUH_MANAGER="10.10.11.40"
WAZUH_COLLECT_AUDIT=true

# Automatic security updates on Debian/Ubuntu
UNATTENDED_UPGRADES=true
