# =============================================================================
# auditd baseline
# Rules are written to a single managed file and validated with augenrules.
# =============================================================================

AUDITD_ENABLED=true
AUDITD_RULES_FILE="/etc/audit/rules.d/99-server-hardening.rules"

# Keep buffer reasonable for typical servers; raise on busy hosts.
AUDITD_BACKLOG_LIMIT=8192
AUDITD_MAX_LOG_FILE=50
AUDITD_NUM_LOGS=5
AUDITD_MAX_LOG_ACTION="rotate"
AUDITD_SPACE_LEFT_ACTION="email"
AUDITD_ADMIN_SPACE_LEFT_ACTION="halt"
